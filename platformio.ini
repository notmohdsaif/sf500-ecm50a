; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32@6.13.0   ; pinned: Arduino-ESP32 core 2.0.17 — mDNS/HTTPClient behaviour depends on this
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.loopTaskStackSize = 16384
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -D TINY_GSM_MODEM_BG96      ; closest AT profile for the Quectel EC801E-CN
    -D TINY_GSM_RX_BUFFER=1024
lib_deps =
    knolleary/PubSubClient           ; PubSubClient.h
    bblanchon/ArduinoJson @ ^6.21.5  ; ArduinoJson v6 (StaticJsonDocument API)
    4-20ma/ModbusMaster              ; ModbusMaster.h (ESP32 compatible)
    vshymanskyy/TinyGSM @ ^0.11.7    ; 4G modem (cellular fallback)
    https://github.com/vshymanskyy/SSLClientMbedTLS.git  ; software TLS over the modem's raw TCP
    arduino-libraries/ArduinoHttpClient @ ^0.6.1  ; HTTP over Client& — used only on the cellular path
    greiman/SdFat @ ^2.2.2           ; microSD on SPI2 — offline buffering + config persistence
    ; WebServer.h, DNSServer.h, Preferences.h, HTTPClient.h, vector - built-in to ESP32 framework

; Host-side unit tests for pure logic (journal encode/decode, offset/retention
; math, config JSON round-trip). Runs on the dev machine, not the ESP32.
; Only the hardware-free translation units are compiled here; everything that
; touches Arduino/WiFi/SdFat is excluded and the pure logic in persist.cpp /
; journal.cpp is guarded with #ifndef UNIT_TEST around the device-only parts.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags = -std=gnu++17 -DUNIT_TEST -Isrc -Itest/native_shim
build_src_filter = -<*> +<persist.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
